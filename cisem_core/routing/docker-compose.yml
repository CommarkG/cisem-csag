# reasoning: |
#   Docker compose orchestration configuration for running the local model router proxy
#   with default env keys and health checks.
#   Parent principles: AxiomsAndPrinciples V1.26 >PR-11200, >PR-11300.

version: '3.8'

services:
  model-router:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cisem-model-router
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
