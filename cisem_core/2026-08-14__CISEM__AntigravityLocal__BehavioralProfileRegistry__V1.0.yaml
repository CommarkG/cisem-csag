# Output Contract — Universal (model-agnostic)
output_contract:
  version: "1.0"
  required_fields:
    - field: EXECUTION
      description: "What was run or written — exact filenames, commands, line ranges."
      empty_allowed: false
    - field: VERIFICATION
      description: "What proof was produced — exit codes, log output, diff reviewed by whom."
      empty_allowed: false
      note: "If nothing was verified, this field must say so explicitly."
    - field: EVIDENCE_TIER
      description: "VERIFIED / FILE-EVIDENCE / INFERRED / UNKNOWN per material claim."
      empty_allowed: false
    - field: GAPS
      description: "What this turn did NOT cover that a complete implementation would require."
      empty_allowed: false
      note: "A turn with no stated gaps is suspicious. Empty GAPS = contract violation."
    - field: SELF_CERT_RISK
      description: "Was --update-hashes or any hash/signature operation run this turn?"
      empty_allowed: false
      note: "Acceptable values: 'None' OR explicit disclosure of what was self-certified."
  enforcement: "mbcs-verifier skill"
  enforcement_tier: "DETECTION — reports violations, does not yet block"

