# CISEM Exchange Protocol State Transition Matrix

---
metadata:
  owner: "CISEM_GOVERNOR"
  canonical_location: "C:\\Users\\finky\\Desktop\\AntiGravity\\Cisem CsAg\\cisem_core\\2026-08-05__CISEM__CXP__StateTransitionMatrix__V1.3.yaml"
