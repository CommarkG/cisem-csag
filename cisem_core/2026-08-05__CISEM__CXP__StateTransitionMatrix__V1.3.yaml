---

transitions:
  - from_state: "CREATED"
    to_state: "READY"
    controller: "CISEM_CLOUD"
    precondition: "Packet schema validates; governance parameters and execution intent are populated."
    side_effect: "Append READY event. Publish to transport medium."
    retry_behavior: "N/A"
    reversibility: "Irreversible."

  - from_state: "READY"
    to_state: "CLAIMED"
    controller: "LOCAL_ADAPTER"
    precondition: "Derived status is READY; current time does not exceed expiration; adapter matches recipient."
    side_effect: "Append CLAIMED event. Acquires lease lock (lease_expires_at is set)."
    retry_behavior: "On claim conflict, wait and retry up to 3 times."
    reversibility: "Reversible if lease expires without execution starting."

  - from_state: "CLAIMED"
    to_state: "EXECUTING"
    controller: "LOCAL_ADAPTER"
    precondition: "Derived status is CLAIMED; adapter holds active lease lock; repository clean check passes."
    side_effect: "Append EXECUTING event. Invokes registered intent runner."
    retry_behavior: "Re-execute if runner fails and attempt_number < max_attempts."
    reversibility: "Irreversible once code writes begin (requires manual Git rollback)."

  - from_state: "EXECUTING"
    to_state: "EXECUTING"
    controller: "LOCAL_ADAPTER"
    precondition: "Derived status is EXECUTING; local adapter continues processing and recording outputs."
    side_effect: "Append EXECUTION_OUTPUT_RECORDED event."
    retry_behavior: "N/A"
    reversibility: "Irreversible."

  - from_state: "EXECUTING"
    to_state: "VALIDATING"
    controller: "LOCAL_ADAPTER"
    precondition: "Runner completes execution; raw logs are captured."
    side_effect: "Append VALIDATING event. Runs verification suites."
    retry_behavior: "N/A"
    reversibility: "Irreversible."

  - from_state: "VALIDATING"
    to_state: "VALIDATING"
    controller: "LOCAL_ADAPTER"
    precondition: "Derived status is VALIDATING; local adapter appends incremental evidence."
    side_effect: "Append EVIDENCE_RECORDED event."
    retry_behavior: "N/A"
    reversibility: "Irreversible."

  - from_state: "VALIDATING"
    to_state: "COMPLETED"
    controller: "LOCAL_ADAPTER"
    precondition: "Evidence validation passes; all required outputs match schema; lessons_learned array is populated."
    side_effect: "Append COMPLETED event. Writes response block and releases lease lock."
    retry_behavior: "N/A"
    reversibility: "Irreversible."

  - from_state: "VALIDATING"
    to_state: "FAILED_VALIDATION"
    controller: "LOCAL_ADAPTER"
    precondition: "Evidence validation fails (errors found or target files modified unapproved)."
    side_effect: "Append FAILED_VALIDATION event. Triggers local gate lock alert."
    retry_behavior: "N/A"
    reversibility: "Irreversible."

  - from_state: "COMPLETED"
    to_state: "AUDITED"
    controller: "CISEM_CLOUD"
    precondition: "Cloud auditor parses and validates evidence, outputs, and lessons learned."
    side_effect: "Append AUDITED event. Writes audit block."
    retry_behavior: "Retry audit up to 3 times on transient cloud timeouts."
    reversibility: "Irreversible."

  - from_state: "AUDITED"
    to_state: "ARCHIVED"
    controller: "CISEM_CLOUD"
    precondition: "Governor approves final completion."
    side_effect: "Append ARCHIVED event. Packet archived."
    retry_behavior: "N/A"
    reversibility: "Irreversible."
